<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jornal da Jade</title>
<meta name="description" content="Jogo de revisão de Redação do 3º ano em 3 missões: reclamação, gráfico de pizza e reescrita da fábula A raposa e as uvas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --tinta: #2A1636; --tinta-2: #5A4468; --papel: #FFFAF0; --papel-2: #FFEFD3; --borda: #2A1636;
  --rosa: #C2185B; --rosa-vivo: #D81B7E; --rosa-claro: #FFE0EF; --amarelo: #FFE45C; --amarelo-claro: #FFF3B8;
  --verde: #1E7A45; --verde-claro: #E2F6E8; --vermelho: #B42318; --vermelho-claro: #FDE8E6; --azul: #1B5FB8; --roxo: #6A3FC9;
  --sombra: 0 6px 0 rgba(42, 22, 54, .25);
  --fonte-titulo: "Baloo 2", "Trebuchet MS", "Segoe UI", sans-serif;
  --fonte: "Nunito", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --cor-e: #C2185B; color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: #3A0F34; color: var(--tinta); font-family: var(--fonte); font-size: 18px; line-height: 1.4; font-weight: 700; overflow-x: hidden; }
button { font-family: inherit; color: inherit; }
[hidden] { display: none !important; }
svg { display: block; }

/* ---------- mundo de fundo (uma cena por missão) ---------- */
.mundo { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.mundo-cena { position: absolute; inset: 0; }
.mundo-cena svg { width: 100%; height: 100%; }
.particulas { position: absolute; inset: 0; }
.particula { position: absolute; bottom: -60px; opacity: .85; animation: subir linear infinite; }
.particula.desce { bottom: auto; top: -60px; animation-name: descer; }
.particula svg { width: 100%; height: 100%; }
@keyframes subir { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(28px, -55vh) rotate(160deg); } 100% { transform: translate(-12px, -115vh) rotate(330deg); } }
@keyframes descer { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(-24px, 55vh) rotate(150deg); } 100% { transform: translate(14px, 115vh) rotate(320deg); } }
@media (prefers-reduced-motion: reduce) { .particula { display: none; } }

/* ---------- moldura ---------- */
#app { position: relative; z-index: 1; max-width: 920px; margin: 0 auto; padding: 10px 12px 28px; }
.topo { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.marca { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--papel); border: 3px solid var(--borda); border-radius: 999px; padding: 3px 14px 3px 4px; box-shadow: var(--sombra); font-family: var(--fonte-titulo); font-weight: 800; font-size: 1.1rem; white-space: nowrap; overflow: hidden; }
.marca .med { width: 40px; height: 40px; flex: none; }
.marca span { overflow: hidden; text-overflow: ellipsis; }
.placar-topo { display: flex; align-items: center; gap: 4px; background: var(--amarelo-claro); border: 3px solid var(--borda); border-radius: 999px; padding: 6px 12px; font-family: var(--fonte-titulo); font-weight: 800; box-shadow: var(--sombra); white-space: nowrap; }
.placar-topo svg { width: 22px; height: 22px; }
.btn-redondo { width: 50px; height: 50px; flex: none; border-radius: 50%; border: 3px solid var(--borda); background: var(--papel); box-shadow: var(--sombra); display: grid; place-items: center; cursor: pointer; padding: 0; }
.btn-redondo svg { width: 26px; height: 26px; }
.btn-redondo.desligado { background: #E9E4F2; }
.btn-redondo:active, .btn:active, .opcao:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(42, 22, 54, .25); }
.cartao { background: var(--papel); border: 3px solid var(--borda); border-radius: 24px; box-shadow: var(--sombra); padding: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 10px 22px; border-radius: 999px; border: 3px solid var(--borda); background: var(--papel); box-shadow: var(--sombra); font-size: 1.1rem; font-weight: 900; cursor: pointer; }
.btn svg { width: 24px; height: 24px; }
.btn-principal { background: var(--rosa); color: #fff; }
.btn-ajuda { background: var(--amarelo); min-height: 48px; padding: 6px 14px; font-size: 1rem; }
.btn-mini { min-height: 48px; padding: 6px 16px; font-size: 1rem; }
.linha-botoes { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 16px; }
h1, h2, h3 { font-family: var(--fonte-titulo); line-height: 1.1; margin: 0; }
.tela { animation: entra .28s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- início ---------- */
.hero { overflow: hidden; padding: 0; }
.hero svg { width: 100%; height: auto; max-height: 300px; }
.hero-txt { padding: 14px 16px 18px; text-align: center; }
.hero-txt h1 { font-size: clamp(2rem, 7vw, 3rem); color: var(--rosa); }
.hero-txt p { margin: 6px 0 0; font-size: 1.1rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
.chip { white-space: nowrap; background: var(--amarelo-claro); border: 2px solid var(--borda); border-radius: 999px; padding: 2px 12px; font-size: .95rem; font-weight: 900; }

/* ---------- guia + balão de fala ---------- */
.guia { display: flex; align-items: flex-end; gap: 8px; margin: 10px 0; }
.guia-rosto { width: 64px; height: 96px; flex: none; }
.guia-rosto svg { width: 100%; height: 100%; overflow: visible; }
.selos { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.selos .selo { width: 58px; height: 58px; flex: none; }
.balao { position: relative; flex: 1; margin: 0; background: #fff; border: 3px solid var(--borda); border-radius: 20px 20px 20px 6px; padding: 10px 14px; font-size: 1.12rem; font-weight: 800; box-shadow: var(--sombra); min-height: 52px; }
.balao.pop { animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.94); } to { transform: none; } }
.balao.bom { background: var(--verde-claro); border-color: var(--verde); }
.balao.ruim { background: var(--vermelho-claro); }
.balao:empty { visibility: hidden; }

/* ---------- mapa das missões ---------- */
.missoes { display: grid; gap: 12px; margin-top: 10px; }
.missao { display: grid; grid-template-columns: 76px 1fr; gap: 4px 12px; align-items: center; background: var(--papel); border: 3px solid var(--borda); border-radius: 22px; box-shadow: var(--sombra); padding: 10px 12px; border-left: 12px solid var(--cor-m); }
.missao .med { width: 72px; height: 72px; grid-row: 1 / 3; }
.missao h3 { font-size: 1.35rem; color: var(--cor-m); }
.missao p { margin: 0; font-size: .98rem; }
.missao .passos { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.passo { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 4px 14px 4px 6px; border-radius: 999px; border: 3px solid var(--borda); background: #fff; font-weight: 900; font-size: .98rem; cursor: pointer; }
.passo .med { width: 36px; height: 36px; }
.passo.feita { background: var(--verde-claro); border-color: var(--verde); }
.passo.travada { opacity: .55; }
.passo .est-st { display: flex; }
.passo .est-st svg { width: 16px; height: 16px; }
.passo.destaque { background: var(--rosa); color: #fff; }
.missao.extra { border-left-color: var(--roxo); background: #F4EEFF; }

/* ---------- faixa da estação ---------- */
.faixa { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; background: var(--cor-e); color: #fff; border: 3px solid var(--borda); border-radius: 22px; padding: 8px 10px; box-shadow: var(--sombra); }
.faixa .med { width: 58px; height: 58px; flex: none; }
.faixa h2 { font-size: clamp(1rem, 4.2vw, 1.7rem); flex: 1; min-width: 0; }
.selo-txt { display: inline-block; background: #fff; color: var(--rosa); border: 2px dashed var(--rosa); border-radius: 10px; padding: 1px 8px; font-size: .85rem; font-weight: 900; letter-spacing: .02em; margin-top: 2px; }
.selo-txt.extra { color: #4B2AA0; border-color: #4B2AA0; background: #F4EEFF; }
.corpo { margin-top: 4px; }

/* ---------- mini-aula ---------- */
.aula { padding: 0; overflow: hidden; }
.aula-arte { border-bottom: 3px solid var(--borda); background: #FFF4DC; }
.aula-arte svg { width: 100%; height: 270px; }
.aula-miolo { padding: 12px 16px 16px; }
.aula-txt { font-size: 1.28rem; line-height: 1.35; font-weight: 800; margin: 6px 0 12px; min-height: 4.2em; }
.aula-txt mark { background: linear-gradient(transparent 35%, var(--amarelo) 35%); color: inherit; padding: 0 2px; border-radius: 3px; }
.aula-pontos { display: flex; gap: 8px; justify-content: center; margin: 4px 0 10px; }
.aula-pontos i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--borda); background: #fff; }
.aula-pontos i.on { background: var(--rosa); }

/* ---------- perguntas ---------- */
.perg { padding: 14px; margin-top: 8px; }
.fig-q { border: 3px solid var(--borda); border-radius: 18px; overflow: hidden; margin-bottom: 10px; background: #FFF4DC; }
.fig-q svg { width: 100%; height: auto; max-height: 230px; }
.enunciado { font-size: 1.25rem; font-weight: 900; margin: 6px 0 10px; }
.opcoes { display: grid; gap: 10px; }
.opcao { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 58px; text-align: left; padding: 10px 14px; border-radius: 18px; border: 3px solid var(--borda); background: #fff; font-size: 1.08rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 rgba(42, 22, 54, .2); }
.opcao .letra { flex: none; font-weight: 900; color: var(--rosa); }
.opcao.certa { background: var(--verde-claro); border-color: var(--verde); }
.opcao.errada { background: var(--vermelho-claro); opacity: .7; text-decoration: line-through; }
.opcao.pisca, .pisca { animation: pisca .55s ease-in-out infinite alternate; }
@keyframes pisca { from { box-shadow: 0 0 0 0 rgba(255, 201, 60, .95); } to { box-shadow: 0 0 0 9px rgba(255, 201, 60, .95); } }
.prox { margin-top: 14px; text-align: center; }
.treme { animation: treme .35s; }
@keyframes treme { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
#est-fim { margin-top: 12px; }
.comecar { text-align: center; padding: 18px; }
.result { text-align: center; padding: 18px; }
.estrelas-g { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
.estrelas-g svg { width: 54px; height: 54px; }

/* ---------- janela do site (texto da reclamação) ---------- */
.nav-janela { border: 3px solid var(--borda); border-radius: 16px; overflow: hidden; background: #fff; box-shadow: var(--sombra); }
.nav-topo { display: flex; align-items: center; gap: 6px; background: #E9E4F2; padding: 6px 10px; border-bottom: 3px solid var(--borda); }
.nav-topo i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--borda); background: #FF8A8A; }
.nav-topo i:nth-child(2) { background: #FFD66B; } .nav-topo i:nth-child(3) { background: #8EDB9B; }
.nav-topo .url { flex: 1; margin-left: 6px; background: #fff; border: 2px solid var(--borda); border-radius: 999px; padding: 0 10px; font-size: .78rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.nav-site { display: flex; align-items: center; gap: 8px; background: var(--rosa-vivo); color: #fff; padding: 4px 12px; font-family: var(--fonte-titulo); font-weight: 800; font-size: 1.35rem; }
.nav-site svg { width: 40px; height: 34px; }
.nav-corpo { padding: 12px 14px 14px; font-size: 1.04rem; line-height: 1.55; font-weight: 700; }
.nav-corpo h3 { font-size: 1.5rem; color: var(--tinta); }
.nav-corpo .envio { margin: 2px 0 8px; font-size: .9rem; color: var(--tinta-2); }
.nav-corpo p { margin: 0 0 8px; }
.g { border-radius: 4px; transition: background .25s; }
.g.grifo { background: var(--amarelo); box-shadow: 0 0 0 2px var(--amarelo); }
.g.nao { background: #FFC9C9; box-shadow: 0 0 0 2px #FFC9C9; }

/* ---------- confete e certificado ---------- */
.confete { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confete i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px; animation: cai 1.6s ease-in forwards; }
@keyframes cai { to { transform: translate(var(--dx), 105vh) rotate(var(--rot)); } }
.aviso-livro { background: var(--amarelo-claro); border: 3px dashed var(--borda); border-radius: 16px; padding: 10px 14px; margin-top: 12px; font-weight: 900; }
.med-g { width: 120px; height: 120px; margin: 0 auto 6px; }

/* ---------- peças das estações ---------- */
.texto-base { background: var(--amarelo-claro); border: 3px solid var(--borda); border-radius: 16px; padding: 10px 12px; font-size: 1.05rem; margin: 0 0 10px; }
.passo-fav { margin: 6px 0 8px; font-family: var(--fonte-titulo); font-weight: 800; font-size: 1.15rem; color: var(--rosa); }
.frases { display: grid; gap: 10px; margin-top: 8px; }
.frase, .ficha { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 54px; padding: 8px 14px; border-radius: 16px; border: 3px solid var(--borda); background: #fff; font-weight: 800; font-size: 1.05rem; text-align: left; cursor: pointer; box-shadow: 0 4px 0 rgba(42, 22, 54, .2); }
.frase.feita { background: var(--verde-claro); border-color: var(--verde); opacity: .75; }
.frase.errada, .ficha.errada { background: var(--vermelho-claro); opacity: .7; text-decoration: line-through; }
.ficha svg { width: 34px; height: 34px; flex: none; }
.papel-resp, .modelo { background: #fff; border: 3px dashed var(--borda); border-radius: 16px; padding: 8px 14px; margin-top: 12px; }
.papel-resp h3, .modelo h3 { font-size: 1.1rem; color: var(--rosa); }
.papel-resp ul { margin: 6px 0 2px; padding-left: 20px; } .papel-resp li { margin: 2px 0; font-weight: 800; }
.modelo { background: var(--amarelo-claro); border-style: solid; } .modelo p { margin: 4px 0 2px; font-size: 1.08rem; font-weight: 800; }

/* formulário do Anexo 15 */
.peca-frase { background: var(--amarelo-claro); border: 3px solid var(--borda); border-radius: 16px; padding: 10px 14px; margin-bottom: 10px; display: grid; gap: 2px; }
.peca-frase.pronta { background: var(--verde-claro); border-color: var(--verde); }
.peca-rot { font-size: .88rem; font-weight: 900; color: var(--rosa); text-transform: uppercase; letter-spacing: .03em; }
.peca-txt { font-size: 1.15rem; font-weight: 900; }
.form-site { background: #A9558F; border: 3px solid var(--borda); border-radius: 18px; padding: 8px 10px 10px; }
.form-topo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.form-topo .fale { background: #fff; border: 2px solid var(--borda); border-radius: 8px; padding: 2px 12px; font-weight: 900; font-size: .95rem; }
.form-topo svg { width: 34px; height: 24px; opacity: .85; }
.form-linha { display: grid; grid-template-columns: 96px 1fr; gap: 6px; margin-bottom: 6px; align-items: stretch; }
.rotulo { background: #fff; border: 2px solid var(--borda); border-radius: 8px; padding: 4px 6px; font-size: .84rem; font-weight: 900; text-align: center; display: grid; place-items: center; line-height: 1.15; }
.campo { min-height: 50px; border: 2px solid var(--borda); border-radius: 8px; background: #fff; padding: 4px 10px; text-align: left; font-weight: 800; font-size: 1rem; cursor: pointer; }
.campo.cheia, .msg-linha.cheia { background: var(--verde-claro); }
.msg { background: #fff; border: 2px solid var(--borda); border-radius: 8px; padding: 4px 8px 6px; margin-top: 4px; }
.msg-linha { display: flex; gap: 8px; align-items: flex-start; width: 100%; min-height: 56px; padding: 6px 4px; border: 0; border-bottom: 2px solid #B8A9C9; background: transparent; text-align: left; font-weight: 800; font-size: 1rem; cursor: pointer; }
.msg-linha i { flex: none; width: 22px; height: 22px; border-radius: 50%; background: #E9DDF0; font-style: normal; font-size: .8rem; display: grid; place-items: center; margin-top: 2px; }
.form-rodape { display: flex; align-items: center; margin-top: 8px; }
.enviar { min-height: 48px; padding: 4px 26px; border-radius: 10px; border: 2px solid var(--borda); background: #7C2E69; color: #fff; font-weight: 900; font-size: 1.05rem; cursor: pointer; }
.enviar:disabled { background: #B79BB0; cursor: default; }

/* gráfico de pizza */
.pizza-box { text-align: center; margin-top: 8px; }
.pizza-tit { font-size: 1.2rem; line-height: 1.15; } .pizza-sub { margin: 2px 0 4px; font-weight: 800; }
.pizza-svg.com-rot { width: min(100%, 520px); }
.pizza-svg { width: min(100%, 340px); height: auto; margin: 4px auto; overflow: visible; }
.fatia { cursor: pointer; transition: transform .2s; outline: none; }
.fatia.sel, .fatia.grifo { transform: translate(var(--dx), var(--dy)); }
.fatia.grifo .corte, .fatia:focus-visible .corte { stroke: #FFE45C; stroke-width: 8; }
.fatia.grifo .corte { filter: drop-shadow(0 0 2px #2A1636); }
.pizza-fonte { margin: 2px 0 6px; font-size: .88rem; font-weight: 800; color: var(--tinta-2); }
.legenda { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip-leg { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 4px 14px; border-radius: 999px; border: 3px solid var(--borda); background: #fff; font-weight: 900; font-size: 1rem; cursor: pointer; }
.chip-leg i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--borda); }
.barras-box { text-align: center; margin-top: 8px; padding: 12px; } #barras-fig svg { width: 100%; max-width: 600px; display: block; margin: 0 auto; height: auto; border: 3px solid var(--borda); border-radius: 12px; cursor: crosshair; }
.svg-pisca { animation: piscaOp .6s ease-in-out infinite alternate; } @keyframes piscaOp { from { opacity: .15; } to { opacity: .55; } }

/* frase da modalidade favorita */
.frase-fav { font-size: 1.2rem; line-height: 2.3; font-weight: 800; margin: 4px 0; }
.lacuna { display: inline-block; min-width: 110px; border-bottom: 4px solid var(--rosa); text-align: center; padding: 0 6px; line-height: 1.5; color: var(--rosa); }
.lacuna.cheia { background: var(--amarelo-claro); border-radius: 8px 8px 0 0; color: var(--tinta); }
.ficha { width: auto; display: inline-flex; margin: 0 6px 8px 0; }
#fichas:has(.ficha) { display: flex; flex-wrap: wrap; }

/* mini-jogo: chuva */
.hud { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 8px; }
.hud .vidas, .hud .pts { display: flex; align-items: center; gap: 2px; background: #fff; border: 3px solid var(--borda); border-radius: 999px; padding: 4px 10px; font-weight: 900; }
.hud svg { width: 24px; height: 24px; }
.pedido { flex: 1 1 100%; background: #fff; border: 3px solid var(--borda); border-radius: 16px; padding: 8px 12px; font-size: 1.2rem; font-weight: 900; text-align: center; margin: 0; }
.tempo { height: 10px; flex: 1 1 100%; background: rgba(255, 255, 255, .5); border: 2px solid var(--borda); border-radius: 999px; overflow: hidden; }
.tempo i { display: block; height: 100%; background: var(--amarelo); width: 100%; }
.chuva { position: relative; height: clamp(260px, calc(100vh - 290px), 540px); border: 3px solid var(--borda); border-radius: 18px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.chuva-cena { position: absolute; inset: 0; } .chuva-cena svg { width: 100%; height: 100%; }
.item { position: absolute; left: 0; top: 0; width: 84px; display: flex; flex-direction: column; align-items: center; pointer-events: none; will-change: transform; }
.item svg { width: 64px; height: 64px; } .chuva.grande .item svg { width: 84px; height: 84px; }
.item b { background: rgba(255, 255, 255, .92); border: 2px solid var(--borda); border-radius: 999px; padding: 0 8px; font-size: .9rem; white-space: nowrap; }
.item.some { transition: opacity .2s, transform .2s; opacity: 0; }
.cesta { position: absolute; left: 0; top: 0; width: 110px; height: 84px; pointer-events: none; will-change: transform; } .cesta svg { width: 100%; height: 100%; }
.toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: 92%; background: #fff; border: 3px solid var(--borda); border-radius: 14px; padding: 6px 12px; font-weight: 900; opacity: 0; transition: opacity .2s; text-align: center; pointer-events: none; }
.toast.on { opacity: 1; } .toast.bom { background: var(--verde-claro); border-color: var(--verde); } .toast.ruim { background: var(--vermelho-claro); border-color: var(--vermelho); }

/* quadrinhos */
.fita { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.fita-vaga { position: relative; aspect-ratio: 300 / 220; border: 3px dashed var(--tinta-2); border-radius: 10px; background: rgba(255, 255, 255, .6); display: grid; place-items: center; overflow: hidden; }
.fita-vaga b { font-family: var(--fonte-titulo); font-size: 1.6rem; color: var(--tinta-2); }
.fita-vaga.cheia { border-style: solid; border-color: var(--verde); background: #fff; display: block; } .fita-vaga.cheia b { display: none; } .fita-vaga svg { width: 100%; height: 100%; }
.quadros { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 560px; margin: 0 auto; }
.quadro-btn { padding: 0; border: 3px solid var(--borda); border-radius: 12px; background: #fff; cursor: pointer; overflow: hidden; box-shadow: 0 4px 0 rgba(42, 22, 54, .2); }
.quadro-btn svg { width: 100%; height: auto; } .quadro-btn.usado { visibility: hidden; }

.texto-final { background: #fff; border: 3px solid var(--borda); border-radius: 16px; padding: 10px 14px 6px; }
.texto-final h3 { font-size: 1.3rem; color: var(--verde); margin-bottom: 4px; }

.checks { display: grid; gap: 8px; margin-top: 6px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px; border-radius: 14px; border: 3px solid var(--borda); background: #fff; font-weight: 800; font-size: 1.04rem; text-align: left; cursor: pointer; }
.check i { flex: none; width: 30px; height: 30px; border-radius: 8px; border: 3px solid var(--borda); background: #fff; display: grid; place-items: center; color: transparent; }
.check i svg { width: 22px; height: 22px; } .check.on { background: var(--verde-claro); border-color: var(--verde); } .check.on i { background: var(--verde); color: #fff; }
.chk-aviso { margin: 8px 0 0; font-weight: 900; color: var(--rosa); }

/* edição especial: cartas */
.cartas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 auto 8px; max-width: 560px; }
.carta { padding: 6px; border: 3px solid var(--borda); border-radius: 14px; background: var(--rosa-claro); cursor: pointer; box-shadow: 0 4px 0 rgba(42, 22, 54, .2); }
.carta .frente { display: block; position: relative; } .carta svg { width: 100%; height: auto; display: block; }
.carta b { position: absolute; left: 21%; top: 52%; transform: translate(-50%, -50%); width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 3px solid var(--borda); display: grid; place-items: center; font-family: var(--fonte-titulo); font-size: 1.4rem; color: var(--rosa); }

    var y0 = B.y0 + i * B.passo, y = B.est ? y0 + 20 : y0, ty = B.est ? y0 + 14 : y + 21, feita = !o.feitas || o.feitas.indexOf(i) >= 0, dest = o.destaque && o.destaque.indexOf(i) >= 0, w = f1(p.h * B.k), nomeX = B.est ? B.x0 : B.x0 + 8;
    if (feita) {
      if (dest) h += '<rect x="' + (B.x0 - 4) + '" y="' + (y - 4) + '" width="' + f1(p.h * B.k + 8) + '" height="' + (B.bh + 8) + '" rx="4" fill="#FFE45C"/>';
      h += '<rect x="' + B.x0 + '" y="' + y + '" width="' + w + '" height="' + B.bh + '" fill="' + p.c + '" stroke="' + T + '" stroke-width="2.5"/>' + (p.n2 && !B.est ? '<text x="' + nomeX + '" y="' + (ty - 7) + '" ' + F + ' font-size="12.5">' + p.n + '</text><text x="' + nomeX + '" y="' + (ty + 7) + '" ' + F + ' font-size="12.5">' + p.n2 + '</text>' : '<text x="' + nomeX + '" y="' + ty + '" ' + F + ' font-size="' + B.fs + '">' + p.n + (p.n2 ? ' ' + p.n2 : '') + '</text>') +
        '<text x="' + f1(B.x0 + p.h * B.k + 7) + '" y="' + (y + B.bh * 0.68) + '" ' + F + ' font-size="' + (B.fs + 1) + '">' + p.h + ' m</text>';
    } else if (o.ativa === i) {
      h += '<rect x="' + B.x0 + '" y="' + y + '" width="' + B.pw + '" height="' + B.bh + '" fill="#FFF3B8" stroke="' + T + '" stroke-width="2.5" stroke-dasharray="6 5"/><text x="' + nomeX + '" y="' + ty + '" ' + F + ' font-size="' + B.fs + '">' + p.n + (p.n2 ? ' ' + p.n2 : '') + ' · ' + p.h + ' m</text>';
      if (o.tent != null) h += '<rect x="' + B.x0 + '" y="' + y + '" width="' + f1(o.tent * B.k) + '" height="' + B.bh + '" fill="' + p.c + '" fill-opacity=".8" stroke="' + T + '" stroke-width="2.5"/>';
    }
  });
  if (o.alvo != null) h += '<rect x="' + f1(B.x0 + (o.alvo - B.tol) * B.k) + '" y="' + B.y0 + '" width="' + f1(2 * B.tol * B.k) + '" height="' + (B.eixo - B.y0 + 22) + '" fill="#2BB673" opacity=".3" class="svg-pisca"/>';
  h += '<path d="M' + B.x0 + ' ' + B.eixo + 'H' + (B.x0 + B.pw + 10) + '" stroke="' + T + '" stroke-width="3"/>';
  for (var t = 0; t <= 1100; t += 100) { var x = f1(B.x0 + t * B.k); h += '<path d="M' + x + ' ' + B.eixo + 'v10" stroke="' + T + '" stroke-width="2.5"/><text x="' + x + '" y="' + (B.eixo + 25 + (B.est && (t / 100) % 2 ? 13 : 0)) + '" text-anchor="middle" ' + F + ' font-size="' + B.fe + '">' + t + '</text>'; }
  h += '<text x="' + (B.W - 6) + '" y="' + (B.eixo + (B.est ? 62 : 48)) + '" text-anchor="end" ' + F.replace('900', '800') + ' font-size="' + B.fe + '">escala em metros</text>';
  if (o.tent != null && o.ativa != null) h += '<path d="M' + f1(B.x0 + o.tent * B.k) + ' ' + B.y0 + 'V' + (B.eixo + 14) + '" stroke="#C2185B" stroke-width="3" stroke-dasharray="5 4"/>';
  return '<svg id="barras-svg" viewBox="0 0 ' + B.W + ' ' + B.H + '" role="img" aria-label="Gráfico de barras horizontais: sete prédios, da maior altura para a menor, com escala de 0 a 1100 metros">' + h + '</svg>';
}
RODAR.predios = function () {
  var meu = EST, aj = AJUSTES_BARRA, k = 0, erros = 0, errB = 0, ativo2 = false, feitas = PREDIOS.map(function (p, i) { return i; }).filter(function (i) { return !aj.some(function (a) { return a.i === i; }); }), tent = null, alvoPisca = null;
  $('est-corpo').innerHTML = '<div class="cartao barras-box"><h3 class="pizza-tit">Alguns dos Prédios mais altos do Mundo</h3><div id="barras-fig"></div><p class="pizza-fonte">Fonte: Almanaque Joca. São Paulo: Magia de ler, 2018.</p></div>' +
    '<div id="pergunta"></div>';
  dockBotao('Completar o gráfico ' + ic('seta'), function () { dockLimpa(); }, 'btn-comeca');
  function desenha(dest) { $('barras-fig').innerHTML = barrasSVG({ feitas: feitas, ativa: ativo2 && k < aj.length ? aj[k].i : null, tent: tent, alvo: alvoPisca, destaque: dest }); }
  desenha(); dizer('predios-d');
  function pedeBarra() { ativo2 = true; errB = 0; tent = null; alvoPisca = null; desenha(); dizer(aj[k].slug, 'balao'); EST.ajuda = aj[k].hint; garanteVisivel($('barras-fig')); }
  function aoToque(ev) {
    var svg = $('barras-svg'); if (!ativo2 || k >= aj.length || !svg || !svg.contains(ev.target)) return;
    var r = svg.getBoundingClientRect(), ux = (ev.clientX - r.left) * BAR.W / r.width, v = Math.max(0, Math.min(1100, Math.round((ux - BAR.x0) / BAR.k / 10) * 10)), alvo = PREDIOS[aj[k].i].h;
    if (Math.abs(v - alvo) <= BAR.tol) {
      ativo2 = false; tent = null; alvoPisca = null; feitas.push(aj[k].i); sfx('acerto'); confete(20); desenha(); limparBalao(); k++;
      if (k < aj.length) setTimeout(function () { if (ativo(meu)) pedeBarra(); }, 900); else setTimeout(function () { if (ativo(meu)) perguntas(); }, 900);
    } else {
      erros++; errB++; sfx('erro'); tent = v; desenha(); garanteVisivel($('barras-fig'));
      setTimeout(function () { tent = null; if (ativo(meu) && ativo2) desenha(); }, 1000);
      if (errB === 1) dizer(aj[k].hint, 'balao', 'ruim'); else { alvoPisca = alvo; desenha(); setTimeout(function () { alvoPisca = null; if (ativo(meu) && ativo2) desenha(); }, 2600); dizer('pisca', 'balao', 'ruim'); }
    }
  }
  $('barras-fig').addEventListener('click', aoToque);
  $('btn-comeca').addEventListener('click', function () { sfx('pop'); $('pergunta').innerHTML = ''; pedeBarra(); });
  function perguntas() {
    sequenciaPerguntas(QPREDIOS, { alvo: 'pergunta', aoAbrir: function () { desenha(); }, aoCerto: function (q) { desenha(q.barras); }, aoErro: function (q, i, n) { if (n >= 2) desenha(q.barras); } },
      function (e) { terminarEstacao(estrelasPorErros(erros + e), 'predios-fim'); });
  }
};

/* ===================== EDIÇÃO ESPECIAL (6 cartas relâmpago) · CERTIFICADO · INÍCIO ===================== */

      else { $('ed-passo').textContent = 'Vire outra carta'; EST.ajuda = 'edicao-d'; rolarPara($('cartas')); }
    } });
    rolarPara($('pergunta'));
  });
};
function jornalMini() { return '<svg viewBox="0 0 80 60" aria-hidden="true"><rect x="2" y="2" width="76" height="56" rx="6" fill="#FFFDF7" stroke="#2A1636" stroke-width="3"/><rect x="7" y="7" width="66" height="11" fill="#D81B7E"/><rect x="7" y="22" width="26" height="22" fill="#BFE6FF" stroke="#2A1636" stroke-width="1.6"/><path d="M38 24H72M38 31H72M38 38H62M7 49H72" stroke="#B9AFCF" stroke-width="3" stroke-linecap="round"/></svg>'; }

function abrirFinal() {

/* toque perdido: depois de um arrasto rápido, o Chrome às vezes engole o próximo toque num botão. Se o click não vier em 350 ms, o botão é acionado assim mesmo. */
document.addEventListener('click', function (ev) { var b = ev.target.closest && ev.target.closest('button'); if (b) b.__clk = Date.now(); }, true);
document.addEventListener('pointerup', function (ev) {
  if (ev.pointerType === 'mouse') return;
  var b = ev.target.closest && ev.target.closest('button'); if (!b || b.disabled) return;
  var t = Date.now();
  setTimeout(function () { if ((b.__clk || 0) >= t || b.disabled || !document.contains(b) || !b.offsetParent) return; b.click(); }, 350);
}, true);
